plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "coverage/**/*"
    - "pkg/**/*"

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Metrics/ModuleLength:
  Exclude:
    - "lib/singulus/multiton.rb"

Metrics/MethodLength:
  Max: 20
  Exclude:
    - "lib/singulus/multiton.rb"

Metrics/AbcSize:
  Max: 20
  Exclude:
    - "lib/singulus/multiton.rb"

Metrics/CyclomaticComplexity:
  Exclude:
    - "lib/singulus/multiton.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "lib/singulus/multiton.rb"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

# Singulus intentionally intercepts Ruby reflection gateways.
Naming/MethodName:
  Exclude:
    - "lib/singulus/internal/reflection_guard.rb"

# Collision-resistant internal state names are intentional.
Naming/MemoizedInstanceVariableName:
  Exclude:
    - "lib/singulus/internal/singleton_class_methods.rb"
    - "lib/singulus/multiton.rb"

# Some specs deliberately exercise reflective dispatch.
Style/SendWithLiteralMethodName:
  Exclude:
    - "spec/**/*"

# The test suite uses textual contract groups in addition to class groups.
RSpec/DescribeClass:
  Enabled: false

# Simple top-level spec names are intentional for this small gem.
RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 8

RSpec/ExampleLength:
  Max: 20

RSpec/NamedSubject:
  Enabled: false

# Development tooling belongs in Gemfile for this project.
Gemspec/DevelopmentDependencies:
  Enabled: false
